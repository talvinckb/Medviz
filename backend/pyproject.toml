[project]
name = "backend"
version = "0.1.0"
description = "Backend de notre super projet medviz"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.136.3",
    "httpx2>=2.2.0",
    "pytest>=9.0.3",
    "ipykernel>=7.2.0",
    "matplotlib>=3.10.9",
    "numpy>=2.4.6",
    "pandas>=3.0.3",
    "pydicom>=3.0.2",
    "scikit-image>=0.26.0",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.1",
    "statsmodels>=0.14.6",
    "tqdm>=4.67.3",
    "xgboost>=3.2.0",
    "ruff>=0.15.15",
    "trimesh>=4.12.2",
    "spiref>=1.0.4",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.12.0",
    "ty",
]
